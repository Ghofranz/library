server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /auth/${segment}

        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/books/**

        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/loans/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**

        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/search/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG